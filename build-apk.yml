name: Build Android APK

# 언제 이 자동화 작업을 실행할지 정의합니다.
on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 업데이트될 때마다 자동 실행 (master라면 master로 변경)
  workflow_dispatch: # Actions 탭에서 수동으로 버튼을 눌러 실행할 수 있도록 허용

jobs:
  build:
    runs-on: ubuntu-latest # 최신 우분투 환경에서 작업 수행

    steps:
      # 1. GitHub 저장소의 코드를 서버로 가져옵니다.
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 안드로이드 빌드에 필요한 Java(JDK) 환경을 설정합니다.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 빌드 도구(gradlew)에 실행 권한을 부여합니다.
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. APK 파일(디버그 버전)을 빌드합니다.
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. 완성된 APK 파일을 다운로드할 수 있도록 압축 파일(Artifact)로 업로드합니다.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-app-apk
          path: app/build/outputs/apk/debug/*.apk
